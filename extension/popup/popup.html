<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aligned</title>
  <link rel="stylesheet" href="../lib/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <img src="../assets/icons/icon48.png" alt="" class="brand-icon">
        <h1>Aligned</h1>
      </div>
      <span id="statusPill" class="status-pill active" role="status" aria-live="polite">
        <span class="status-dot"></span>
        <span id="statusText">Active</span>
      </span>
    </header>

    <div id="permissionWarning" class="permission-warning" role="alert" hidden>
      <strong>Notifications disabled</strong>
      <p>Enable notifications for Chrome in your system settings to receive reminders.</p>
    </div>

    <div class="pause-area">
      <button id="toggleBtn" class="toggle-btn">Pause reminders</button>
      <div id="pauseOptions" class="pause-options" hidden>
        <button class="pause-option" data-minutes="30">30 minutes</button>
        <button class="pause-option" data-minutes="60">1 hour</button>
        <button class="pause-option" data-minutes="tomorrow">Rest of day</button>
        <button class="pause-option" data-minutes="forever">Until I resume</button>
      </div>
      <p id="resumeInfo" class="resume-info" hidden></p>
    </div>

    <div class="stats">
      <div class="stat-tile">
        <span id="todayPosture" class="stat-value">0</span>
        <span class="stat-label">Posture checks today</span>
      </div>
      <div class="stat-tile">
        <span id="todayBreaks" class="stat-value">0</span>
        <span class="stat-label">Breaks taken today</span>
      </div>
    </div>

    <div class="schedule">
      <div class="schedule-row">
        <span class="schedule-label">Posture check</span>
        <span id="postureInterval" class="schedule-value">every 10 min</span>
      </div>
      <div class="schedule-row">
        <span class="schedule-label">Movement break</span>
        <span id="stretchInterval" class="schedule-value">every 30 min</span>
      </div>
      <div class="schedule-row" id="workingHoursRow" hidden>
        <span class="schedule-label">Active hours</span>
        <span id="workingHours" class="schedule-value">9:00 – 17:00</span>
      </div>
    </div>

    <footer class="footer">
      <a href="#" id="settingsLink">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        Settings
      </a>
    </footer>
  </div>

  <script src="../lib/theme-provider.js"></script>
  <script src="popup.js"></script>
</body>
</html>
