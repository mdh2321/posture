<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posture Check</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="../assets/icons/icon48.png" alt="Posture Check" class="header-icon">
      <h1>Posture Check</h1>
    </div>

    <!-- Notification Permission Warning -->
    <div id="permissionWarning" class="permission-warning" style="display: none;">
      <strong>⚠️ Notifications Disabled</strong>
      <p>Enable notifications in your browser settings to receive reminders.</p>
    </div>

    <div class="status">
      <div class="status-indicator">
        <span id="statusDot" class="dot enabled"></span>
        <span id="statusText">Active</span>
      </div>
    </div>

    <div class="controls">
      <button id="toggleBtn" class="btn btn-primary">Pause Reminders</button>
    </div>

    <div class="info">
      <div class="info-row">
        <span class="label">Posture checks:</span>
        <span id="postureInterval" class="value">Every 10 min</span>
      </div>
      <div class="info-row">
        <span class="label">Stretch breaks:</span>
        <span id="stretchInterval" class="value">Every 30 min</span>
      </div>
      <div class="info-row" id="workingHoursRow" style="display: none;">
        <span class="label">Working hours:</span>
        <span id="workingHours" class="value">9:00 - 17:00</span>
      </div>
    </div>

    <div class="quick-actions">
      <button id="testPostureBtn" class="btn btn-secondary btn-small">Test Posture Reminder</button>
      <button id="testStretchBtn" class="btn btn-secondary btn-small">Test Stretch Reminder</button>
    </div>

    <div class="footer">
      <a href="#" id="settingsLink">⚙️ Settings</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
